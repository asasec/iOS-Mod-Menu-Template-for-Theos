name: Build Mod Menu

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Theos & Patch SDKs
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
        echo "THEOS=~/theos" >> $GITHUB_ENV
        
        # SDK klasörünü hazırlayıp güncel SDK'ları indiriyoruz
        rm -rf ~/theos/sdks
        git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks

    - name: Find Makefile and Build
      run: |
        export THEOS=~/theos
        
        MAKE_DIR=$(find . -maxdepth 3 -name "Makefile" -exec dirname {} \; | head -n 1)
        
        if [ -n "$MAKE_DIR" ]; then
          cd "$MAKE_DIR"
          
          # Indirilen klasördeki ilk SDK adını otomatik yakalayıp TARGET olarak atar
          LATEST_SDK=$(ls ~/theos/sdks | grep iPhoneOS | head -n 1 | sed 's/iPhoneOS//' | sed 's/\.sdk//')
          echo "Kullanılan SDK Sürümü: $LATEST_SDK"
          
          make package FINALPACKAGE=1 TARGET=iphone:clang:$LATEST_SDK:14.0 || make FINALPACKAGE=1 TARGET=iphone:clang:$LATEST_SDK:14.0 || make
        else
          echo "Makefile bulunamadı!"
          exit 1
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Mod-Menu-Output
        path: |
          **/*.dylib
          **/*.deb
          packages/*.deb
